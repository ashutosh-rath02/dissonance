<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dissonance{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a href="/review" class="logo">Dissonance</a>
      <span class="tagline">{% block tagline %}Contradiction detection for LLM-evaluation research{% endblock %}</span>
      <nav class="site-nav">
        <a href="/review">Contradictions</a>
        <a href="/review/escalated">Escalation Queue</a>
        <a href="/">Claim Review (internal)</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>{% block footer %}Dissonance -- claim-level, citation-independent contradiction detection.{% endblock %}</span>
    </footer>
  </div>
</body>
</html>
