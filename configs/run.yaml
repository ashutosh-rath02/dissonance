# Per-run supervisor config: budgets, caps, model tiers per stage.
# Loaded by dissonance.supervisor.config.RunConfig

run:
  budget_usd: 5.00          # hard ceiling for the whole run
  warn_at_fraction: 0.90    # supervisor halts gracefully and reports at this fraction
  wall_clock_cap_seconds: 3600

models:
  # price_per_1m_* are approximate list prices used only to estimate spend
  # against the budget below; not invoiced truth. Update as pricing changes.
  #
  # Using gpt-4.1(-mini) as a stand-in for gpt-5(-mini): this OpenAI org isn't
  # verified for the gpt-5 family yet (platform.openai.com/settings/organization
  # -> Verify Organization). Swap `name` back to gpt-5-mini/gpt-5 once verified
  # -- everything else (pricing fields, tier plumbing) stays the same shape.
  cheap:
    provider: openai
    name: gpt-4.1-mini
    max_output_tokens: 2048
    price_per_1m_input: 0.40
    price_per_1m_output: 1.60
  strong:
    provider: openai
    name: gpt-4.1
    max_output_tokens: 4096
    price_per_1m_input: 2.00
    price_per_1m_output: 8.00

embedding:
  provider: openai
  name: text-embedding-3-small
  dimensions: 1536              # must match claims.embedding vector(1536) in schema.sql
  price_per_1m_input: 0.02

stages:
  planner:
    model_tier: cheap
    budget_usd: 0.20
  scouts:
    budget_usd: 0.00         # arXiv/OpenAlex/Semantic Scholar APIs are free
    rate_limit_per_sec: 1
  screener:
    model_tier: cheap
    budget_usd: 0.50
  extraction:
    model_tier: cheap
    budget_usd: 2.00
    max_retries: 3           # schema-invalid -> retry w/ validator error injected
    escalation:
      confidence_threshold: 0.55
      consecutive_failures_to_escalate: 2
      max_escalations: 1
  hunter:
    model_tier: cheap
    budget_usd: 0.50
    top_k: 5                 # nearest neighbors per claim to consider as candidates
    # Measured against the real corpus (203 claims, 49 papers): max cross-paper
    # cosine similarity for text-embedding-3-small on short assertion text is
    # ~0.61, not the ~0.85+ you'd see on a narrowly-scoped corpus. This is
    # because the Week 1 arXiv query ("LLM evaluation") pulled a topically
    # broad set of papers (physics, hardware, medical robotics alongside
    # actual LLM-eval papers) -- a corpus-scoping issue, not a hunter bug.
    # 0.45 was chosen by inspecting the top-15 highest-similarity pairs by
    # hand; below it pairs stopped looking like plausible candidates.
    min_similarity: 0.45
  adjudicator:
    budget_usd: 1.50
    tiers: [cheap, strong]   # start cheap; escalate to strong if confidence is low
    max_tiers: 2             # beyond this: verdict = insufficient_context
    confidence_threshold: 0.65
  synthesis:
    model_tier: strong
    budget_usd: 0.30
  judge:
    # LLM-judge review of extracted claims (evals/llm_judge.py) -- NOT the
    # adjudicator (claim-vs-claim conflicts, Week 4). This judges a single
    # claim against its own source quote. Strong tier: this data feeds
    # eval numbers, worth paying for quality over cheap-tier savings.
    model_tier: strong
    budget_usd: 1.00

loops:
  identical_failure_breaker:
    max_repeats: 3           # same error signature 3x on same unit -> stop, log, move on
  re_extraction:
    max_round_trips: 1       # extraction_error verdict -> re-queue; 2nd failure -> human queue

corpus:
  domain: "LLM evaluation"
  cap_papers: 500
  language: en
